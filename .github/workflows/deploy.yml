name: Deploy MATLens

# Builds the app and publishes it to GitHub Pages on every push to the default
# branch. The verification suite runs first: a build that cannot pass its own
# checks does not get published.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, and let a running one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 24 matches the version the suite is developed and verified on.
          # jsdom's undici dependency needs a newer Node than 20 provides.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Run the verification suite
        run: npm run verify

      - name: Build
        run: npm run build
        env:
          # A project site lives at /<repo>/, and reads the repo name so that
          # renaming the repository does not silently break every asset URL.
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
